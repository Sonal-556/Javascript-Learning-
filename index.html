<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Tracker</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Heading -->
    <h1 style="text-align: center;">My To Do-List</h1>

    <!-- Add Task Form -->
    <div class="task-form">

        <input 
            placeholder="Enter subject"
        >

        <button id="addTaskBtn">Add Task</button>

    </div>

    <!-- Subject Filter Tabs -->
    <div id="filters">
        <button data-subject="All">All</button>
    </div>
    <br> <br>
    
    <!-- Tasks will be displayed here -->
    <div id="app">
    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
